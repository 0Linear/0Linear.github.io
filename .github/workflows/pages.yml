name: Deploy to GitHub Pages

# Builds OS.js in standalone mode (no server) with the files in ./welcome
# and publishes ./dist to GitHub Pages.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Discovers apps/themes (copied, not symlinked), builds the client,
      # then turns ./welcome into dist/welcome
      - run: npm run build:pages
        env:
          NODE_ENV: production
          # OS.js uses webpack 4, which needs this on Node 17+
          NODE_OPTIONS: --openssl-legacy-provider

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
